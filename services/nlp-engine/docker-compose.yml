cat > docker-compose.yml <<'EOF'
version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  pipeline:
    build: .
    container_name: coastguard-pipeline
    depends_on:
      - rabbitmq
    env_file:
      - .env
    environment:
      - RABBIT_HOST=rabbitmq
    restart: unless-stopped
EOF
